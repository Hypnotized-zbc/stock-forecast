  /* 背景遮罩：保证卡片文字可读 */
  body::before {
    content: ""; position: fixed; inset: 0;
    background: rgba(255,255,255,.35);
    backdrop-filter: blur(2px);
    z-index: 0;
  }
  .lang-switch {
    position: fixed; top: 18px; right: 24px; z-index: 10;
    display: flex; border-radius: 20px; overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.18);
  }
  .lang-switch .lang-item {
    padding: 6px 18px; font-size: 13px; cursor: pointer;
    background: rgba(255,255,255,.9); color: #6b7280;
    transition: background .15s, color .15s;
    user-select: none; border: 1px solid #d1d5db;
  }
  .lang-switch .lang-item:first-child { border-radius: 20px 0 0 20px; }
  .lang-switch .lang-item:last-child { border-radius: 0 20px 20px 0; }
  .lang-switch .lang-item.active {
    background: #2563eb; color: #fff; border-color: #2563eb;
  }
  .card {
    position: relative; z-index: 1;
    width: 440px; max-width: 92vw;
    background: rgba(255,255,255,.96);
    border-radius: 16px;
    box-shadow: 0 14px 50px rgba(0,0,0,.18);
    padding: 36px 34px 28px;
  }
  .logo { text-align: center; margin-bottom: 22px; }
  .logo h1 { font-size: 24px; margin: 0 0 6px; color: #111827; }
  .logo p { font-size: 12px; color: #9ca3af; margin: 0; }
  .tabs { display: flex; margin-bottom: 18px; border-bottom: 1px solid #e5e7eb; }
  .tab {
    flex: 1; padding: 10px 0; text-align: center; cursor: pointer;
    border: none; background: none; font-size: 15px; color: #4b5563;
    border-bottom: 2px solid transparent;
  }
  .tab.active { color: #2563eb; border-bottom-color: #2563eb; font-weight: 600; }
  .field { margin-bottom: 14px; }
  .field input {
    width: 100%; padding: 11px 13px;
    border: 1px solid #d1d5db; border-radius: 8px;
    font-size: 14px; outline: none; transition: border .15s;
  }
  .field input:focus { border-color: #2563eb; }
  .hint { color: #dc2626; font-size: 12px; margin-top: 4px; min-height: 16px; line-height: 1.4; }
  .hint:empty { margin-top: 0; }
  .captcha-row { display: flex; gap: 10px; }
  .captcha-row input { flex: 1; text-transform: uppercase; }
  .captcha-row img {
    height: 44px; border: 1px solid #e5e7eb; border-radius: 8px;
    cursor: pointer; background: #f9fafb;
  }
  .msg { color: #c0392b; font-size: 12px; min-height: 18px; margin-bottom: 8px; }
  .msg.ok { color: #16a34a; }
  .submit {

<script>
let _authMode = "login";
let _captchaId = "";
const $ = id => document.getElementById(id);

// ---- 语言切换（中/英）----
const I18N = {
  zh: {
    appTitle: "股票历史数据查询", appSub: "登录后使用自选股 · AI 解读 · 数据云端同步",
    tabLogin: "登录", tabReg: "注册",

    phCaptcha: "验证码", phEmail: "密保邮箱（用于找回/修改密码）", phPass2: "再次输入密码", btnLogin: "登录", btnReg: "注册", footNote: "仅供学习研究，不构成投资建议",

    pChar: "密码只能包含字母和数字", pUpper: "密码需包含大写字母",

    netErr: "网络错误，请重试", okEnter: "登录成功，正在进入...", unknown: "未知错误", reqFail: "请求失败",

  },
  en: {
    appTitle: "Stock History Data Query", appSub: "Watchlist · AI Insight · Cloud Sync after login",
    tabLogin: "Sign In", tabReg: "Sign Up",
    phUser: "Username: letters/digits/underscore, 3-20 chars", phPass: "Password: 8-20 chars, upper+lower+digit",
    phCaptcha: "Captcha", phEmail: "Security email (for password reset)", phPass2: "Confirm password", btnLogin: "Sign In", btnReg: "Sign Up", footNote: "For study only, not investment advice",
    captchaTip: "Click to refresh",
    uShort: "Username too short, min 3 chars", uLong: "Username too long, max 20 chars",
    uChar: "Username: letters, digits, underscore only", uUnder: "Username cannot be only underscores",
    pShort: "Password too short, min 8 chars", pLong: "Password too long, max 20 chars",
    pChar: "Password: letters and digits only", pUpper: "Password needs an uppercase letter",
    pLower: "Password needs a lowercase letter", pDigit: "Password needs a digit",
    needCaptcha: "Please enter the captcha", needUserPass: "Please enter username and password", eFormat: "Invalid email format", eLong: "Email too long", pwd2NotMatch: "Passwords do not match",
    netErr: "Network error, please retry", okEnter: "Signed in, entering...", unknown: "Unknown error", reqFail: "Request failed",
    slTitle: "Security Verification", slTip: "Drag the piece to the gap", slLoading: "Loading verification...",
    slTooFast: "Dragged too fast or suspicious track, retry", slFail: "Verification failed, retry",
    forgotPwd: "Forgot password?", resetTitle: "Reset Password", resetOk: "Reset",
    resetFillAll: "Enter username, security email and new password", resetOkMsg: "Password reset, sign in with new password",
    slDone: "Verified", slDrag: "Hold and drag right",
  }
};
let _lang = "zh";
try { _lang = localStorage.getItem("sf_lang") || "zh"; } catch (e) { _lang = "zh"; }
function t(key) { return (I18N[_lang] && I18N[_lang][key]) || key; }
function applyLang() {
  // 浏览器原生控件（日期选择器等）跟随 html lang 属性
  document.documentElement.lang = _lang === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => {
    el.placeholder = t(el.dataset.i18nPh);
  });
  $("captchaImg").title = t("captchaTip");
  $("authSubmit").textContent = _authMode === "register" ? t("btnReg") : t("btnLogin");
}
function setLang(lang) {
  _lang = lang;
  try { localStorage.setItem("sf_lang", lang); } catch (e) {}
  document.querySelectorAll(".lang-item").forEach(el => {
    el.classList.toggle("active", el.dataset.lang === lang);
  });
  applyLang();
  // 清空提示文案（语言切换后旧提示不匹配）
  $("usernameHint").textContent = "";
  $("passwordHint").textContent = "";
  $("password2Hint").textContent = "";
  $("authMsg").textContent = "";
}
document.querySelectorAll(".lang-item").forEach(el => {
  el.addEventListener("click", () => { if (el.dataset.lang !== _lang) setLang(el.dataset.lang); });
});

function setTab(mode) {
  _authMode = mode;
  closeSlider();  // 切换登录/注册 tab 时关闭滑块弹窗
  $("tabLogin").classList.toggle("active", mode === "login");
  $("tabReg").classList.toggle("active", mode === "register");
  $("captchaRow").style.display = mode === "register" ? "flex" : "none";
  $("emailRow").style.display = mode === "register" ? "block" : "none";
  $("pwd2Row").style.display = mode === "register" ? "block" : "none";
  $("authSubmit").textContent = mode === "register" ? t("btnReg") : t("btnLogin");
  $("authMsg").textContent = "";
  $("authMsg").className = "msg";
  $("authUsername").value = "";
  $("authPassword").value = "";
  $("authPassword2").value = "";
  $("authEmail").value = "";
  $("authCaptcha").value = "";
  $("usernameHint").textContent = "";
  $("passwordHint").textContent = "";
  $("password2Hint").textContent = "";
  $("emailHint").textContent = "";
  $("authPassword").autocomplete = mode === "register" ? "new-password" : "current-password";
  if (mode === "register") loadCaptcha();
}
$("tabLogin").addEventListener("click", () => setTab("login"));
$("tabReg").addEventListener("click", () => setTab("register"));

// 实时合法性校验：返回不合法原因（空串=合法）
function usernameError(v) {
  if (!v) return "";
  if (v.length < 3) return t("uShort");
  if (v.length > 20) return t("uLong");
  if (!/^[A-Za-z0-9_]+$/.test(v)) return t("uChar");
  if (/^_+$/.test(v)) return t("uUnder");
  return "";
}
function passwordError(v) {
  if (!v) return "";
  if (v.length < 8) return t("pShort");
  if (v.length > 20) return t("pLong");
  if (!/^[A-Za-z0-9]+$/.test(v)) return t("pChar");
  if (!/[A-Z]/.test(v)) return t("pUpper");
  if (!/[a-z]/.test(v)) return t("pLower");
  if (!/[0-9]/.test(v)) return t("pDigit");
  return "";
}
function emailError(v) {
  if (!v) return "";
  if (v.length > 100) return t("eLong");
  if (!/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(v)) return t("eFormat");
  return "";
}
function password2Error() {
  const v = $("authPassword").value;
  const v2 = $("authPassword2").value;
  if (!v2) return "";
  return v === v2 ? "" : t("pwd2NotMatch");
}
function updateHints() {
  $("usernameHint").textContent = usernameError($("authUsername").value);
  $("passwordHint").textContent = passwordError($("authPassword").value);
  $("password2Hint").textContent = password2Error();
  $("emailHint").textContent = emailError($("authEmail").value);
}
$("authUsername").addEventListener("input", updateHints);
$("authPassword").addEventListener("input", updateHints);
$("authPassword2").addEventListener("input", updateHints);
$("authEmail").addEventListener("input", updateHints);

async function loadCaptcha() {
  try {
    const d = await (await fetch("/api/captcha")).json();
    _captchaId = d.captcha_id;
    $("captchaImg").src = d.svg;
  } catch (e) { /* 静默 */ }
}
$("captchaImg").addEventListener("click", loadCaptcha);

// ---- 滑块人机验证 ----
let _sliderData = null;  // 当前滑块 {id, trackW, cell, gapY}
let _sliderDrag = null;  // 拖动状态 {startX, btnStart, pieceStart, t0, samples}
let _sliderCallback = null;  // 滑块通过后的回调（默认 doRealSubmit，重置密码时用 doRealResetPwd）

function openSlider(cb) {
  _sliderCallback = cb || null;
  const ov = document.getElementById("sliderOverlay");
  ov.classList.add("show");
  const msg = document.getElementById("sliderMsg");
  msg.textContent = t("slLoading"); msg.className = "slider-msg";
  loadSlider();
}
function closeSlider() {
  document.getElementById("sliderOverlay").classList.remove("show");
}
function loadSlider() {
  const msg = document.getElementById("sliderMsg");
  msg.textContent = t("slLoading"); msg.className = "slider-msg";
  fetch("/api/slider").then(r => r.json()).then(d => {
    _sliderData = {id: d.slider_id, trackW: d.track_w, cell: d.cell, gapY: d.gap_y};
    document.getElementById("sliderBg").src = d.bg;
    document.getElementById("sliderPiece").querySelector("img").src = d.piece;
    // 碎片纵向定位到缺口行，横向初始 0
    const piece = document.getElementById("sliderPiece");
    piece.style.top = (d.gap_y - d.cell / 2) + "px";
    piece.style.left = "0px";
    const btn = document.getElementById("sliderBtn");
    btn.style.left = "2px";
    document.getElementById("sliderFill").style.width = "0px";
    msg.textContent = t("slDrag"); msg.className = "slider-msg";
  }).catch(() => {
    msg.textContent = t("reqFail"); msg.className = "slider-msg";
  });
}
function sliderSubmit() {
  // 松手：计算终点位置 / 时长 / 轨迹点数，若前端判定太假直接重来
  const d = _sliderDrag;
  _sliderDrag = null;
  document.getElementById("sliderBtn").classList.remove("dragging");
  const btn = document.getElementById("sliderBtn");
  const msg = document.getElementById("sliderMsg");
  if (!d || !_sliderData) return;
  const dur = Date.now() - d.t0;
  const x = parseFloat(btn.style.left) + _sliderData.cell / 2;  // 碎片中心 x
  if (dur < 300 || d.samples < 3) {
    msg.textContent = t("slTooFast"); msg.className = "slider-msg";
    setTimeout(loadSlider, 600);
    return;
  }
  // 通过前端自检：真实提交（登录/注册/重置密码；后端会校验位置误差）
  const info = {id: _sliderData.id, x: Math.round(x),
                duration_ms: dur, samples: d.samples};
  if (_sliderCallback) { const cb = _sliderCallback; _sliderCallback = null; cb(info); }
  else { doRealSubmit(info); }
}
function initSliderEvents() {
  const btn = document.getElementById("sliderBtn");
  const piece = document.getElementById("sliderPiece");
  const fill = document.getElementById("sliderFill");
  btn.addEventListener("mousedown", e => {
    e.preventDefault();
    const trackW = _sliderData ? _sliderData.trackW : 280;
    const cell = _sliderData ? _sliderData.cell : 40;
    _sliderDrag = {startX: e.clientX, btnStart: parseFloat(btn.style.left) || 2,
                   pieceStart: parseFloat(piece.style.left) || 0,
                   t0: Date.now(), samples: 1,
                   maxX: trackW - cell};
    btn.classList.add("dragging"); piece.classList.add("dragging");
    const onMove = ev => {
      if (!_sliderDrag) return;
      let dx = ev.clientX - _sliderDrag.startX;
      let bx = Math.max(2, Math.min(_sliderDrag.maxX, _sliderDrag.btnStart + dx));
      btn.style.left = bx + "px";
      piece.style.left = (bx - 2) + "px";
      fill.style.width = (bx - 2) + "px";
      _sliderDrag.samples++;
    };
    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      piece.classList.remove("dragging");
      sliderSubmit();
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  });
}

async function authSubmit() {
  const username = $("authUsername").value.trim();
  const password = $("authPassword").value;
  const captcha = $("authCaptcha").value.trim();
  const msg = $("authMsg");
  // 前置格式校验（不弹滑块）
  if (_authMode === "register") {
    const uErr = usernameError(username);
    if (uErr) { msg.textContent = uErr; return; }
    const pErr = passwordError(password);
    if (pErr) { msg.textContent = pErr; return; }
    if (password !== $("authPassword2").value) { msg.textContent = t("pwd2NotMatch"); return; }
    const eErr = emailError($("authEmail").value.trim().toLowerCase());
    if (eErr) { msg.textContent = eErr; return; }
    if (!captcha) { msg.textContent = t("needCaptcha"); return; }
  } else {
    if (!username || !password) { msg.textContent = t("needUserPass"); return; }
    const uErr = usernameError(username);
    if (uErr) { msg.textContent = uErr; return; }
    const pErr = passwordError(password);
    if (pErr) { msg.textContent = pErr; return; }
  }
  // 弹滑块人机验证；拖动完成后由 doRealSubmit 携带滑块参数提交
  openSlider();
}
async function doRealSubmit(sliderInfo) {
  const username = $("authUsername").value.trim();
  const password = $("authPassword").value;
  const captcha = $("authCaptcha").value.trim();
  const msg = $("authMsg");
  const btn = $("authSubmit");
  btn.disabled = true;
  try {
    let path, body;
    if (_authMode === "register") {
      path = "/api/register";
      body = {username, password, email: $("authEmail").value.trim().toLowerCase(),
              captcha_id: _captchaId, captcha,
              slider_id: sliderInfo.id, slider_x: sliderInfo.x,
              slider_duration_ms: sliderInfo.duration_ms, slider_samples: sliderInfo.samples};
    } else {
      path = "/api/login";
      body = {username, password,
              slider_id: sliderInfo.id, slider_x: sliderInfo.x,
              slider_duration_ms: sliderInfo.duration_ms, slider_samples: sliderInfo.samples};
    }
    const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    const d = await r.json();
    if (!r.ok) {
      if (d.error && d.error.indexOf("滑块") >= 0) {
        // 后端滑块校验失败：保留弹窗，刷新滑块重试
        document.getElementById("sliderMsg").textContent = t("slFail");
        document.getElementById("sliderMsg").className = "slider-msg";
        loadSlider();
        btn.disabled = false;
        return;
      }
      closeSlider();
      msg.textContent = d.error || t("reqFail");
      if (_authMode === "register") loadCaptcha();
      btn.disabled = false;
      return;
    }
    closeSlider();
    if (d.token) {
      try {
        localStorage.setItem("sf_token", d.token);
        localStorage.setItem("sf_user", d.username || username);
      } catch (e) {}
      msg.className = "msg ok";
      msg.textContent = t("okEnter");
      setTimeout(() => { location.href = "/app"; }, 400);
    } else {
      btn.disabled = false;
      msg.textContent = d.error || t("unknown");
    }
  } catch (e) {
    btn.disabled = false;
    msg.textContent = t("netErr");
  }
}
$("authSubmit").addEventListener("click", authSubmit);
$("authPassword").addEventListener("keydown", e => { if (e.key === "Enter") authSubmit(); });
$("authCaptcha").addEventListener("keydown", e => { if (e.key === "Enter") authSubmit(); });
initSliderEvents();

// ---- 忘记密码（重置密码：账号 + 密保邮箱 + 验证码 + 滑块）----
let _rpCaptchaId = "";
function rpEmailError(v) {
  if (!v) return "";
  if (v.length > 100) return t("eLong");
  if (!/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(v)) return t("eFormat");
  return "";
}
async function loadRpCaptcha() {
  try {
    const d = await (await fetch("/api/captcha")).json();
    _rpCaptchaId = d.captcha_id;
    $("rpCaptchaImg").src = d.svg;
  } catch (e) { /* 静默 */ }
}
function openResetPwd() {
  $("resetPwdOverlay").style.display = "flex";
  $("rpUsername").value = "";
  $("rpEmail").value = "";
  $("rpNew").value = "";
  $("rpNew2").value = "";
  $("rpCaptcha").value = "";
  $("rpMsg").textContent = "";
  $("rpMsg").className = "msg";
  loadRpCaptcha();
}
function closeResetPwd() {
  $("resetPwdOverlay").style.display = "none";
}
$("forgotPwdLink").addEventListener("click", openResetPwd);
$("rpCancel").addEventListener("click", closeResetPwd);
$("rpCaptchaImg").addEventListener("click", loadRpCaptcha);
// 前置校验 → 弹滑块 → 滑块通过后 doRealResetPwd
function submitResetPwd() {
  const username = $("rpUsername").value.trim();
  const email = $("rpEmail").value.trim().toLowerCase();
  const newPw = $("rpNew").value;
  const newPw2 = $("rpNew2").value;
  const captcha = $("rpCaptcha").value.trim();
  const msg = $("rpMsg");
  if (!username || !email || !newPw) { msg.textContent = t("resetFillAll"); return; }
  const uErr = usernameError(username);
  if (uErr) { msg.textContent = uErr; return; }
  const eErr = rpEmailError(email);
  if (eErr) { msg.textContent = eErr; return; }
  const pErr = passwordError(newPw);
  if (pErr) { msg.textContent = pErr; return; }
  if (newPw !== newPw2) { msg.textContent = t("chgNotMatch"); return; }
  if (!captcha) { msg.textContent = t("needCaptcha"); return; }
  openSlider((info) => doRealResetPwd(info));
}
async function doRealResetPwd(sliderInfo) {
  const username = $("rpUsername").value.trim();
  const email = $("rpEmail").value.trim().toLowerCase();
  const newPw = $("rpNew").value;
  const captcha = $("rpCaptcha").value.trim();
  const msg = $("rpMsg");
  const btn = $("rpOk");
  btn.disabled = true;
  try {
    const r = await fetch("/api/reset-password", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({username: username, email: email, new_password: newPw,
                            captcha_id: _rpCaptchaId, captcha: captcha,
                            slider_id: sliderInfo ? sliderInfo.id : "",
                            slider_x: sliderInfo ? sliderInfo.x : 0,
                            slider_duration_ms: sliderInfo ? sliderInfo.duration_ms : 0,
                            slider_samples: sliderInfo ? sliderInfo.samples : 0})
    });
    const d = await r.json();
    if (!r.ok) {
      if (d.error && d.error.indexOf("滑块") >= 0) {
        document.getElementById("sliderMsg").textContent = t("slFail");
        document.getElementById("sliderMsg").className = "slider-msg";
        loadSlider();
        btn.disabled = false;
        return;
      }
      closeSlider();
      msg.textContent = d.error || t("reqFail");
      loadRpCaptcha();
      btn.disabled = false;
      return;
    }
    closeSlider();
    msg.className = "msg ok";
    msg.textContent = d.message || t("resetOkMsg");
    setTimeout(closeResetPwd, 1500);
  } catch (e) {
    btn.disabled = false;
    msg.textContent = t("netErr");
  }
}
$("rpOk").addEventListener("click", submitResetPwd);
$("rpNew2").addEventListener("keydown", e => { if (e.key === "Enter") submitResetPwd(); });

// 页面加载：应用语言偏好（登录页优先显示登录；不做自动跳转，避免登录页⇄功能页闪烁）
setLang(_lang);
</script>
