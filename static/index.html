// ---- 多股归一化对比 ----
const CMP_COLORS = ["#2563eb", "#dc2626", "#16a34a", "#f59e0b", "#8b5cf6", "#06b6d4", "#e11d48", "#7c3aed"];

function cmpCandidates() {
  const list = [];
  if (_curSecid) list.push({secid: _curSecid, name: _curName || "当前股票"});
  for (const w of _watch) {
    if (!w || !w.secid) continue;
    if (!list.some(x => x.secid === w.secid)) list.push({secid: w.secid, name: w.name});
  }
  return list;
}

function cmpDataOf(secid) {
  // 对比图固定用日K数据：只读日K缓存，不受当前 K线周期切换影响
  try {
    const keys = Object.keys(localStorage).filter(k => k.startsWith("kline_" + secid + "_day_"));
    if (!keys.length) return null;
    const o = JSON.parse(localStorage.getItem(keys[0]));
    if (!o.ts || Date.now() - o.ts > 24 * 3600 * 1000) return null;
    return o.data;
  } catch (e) { return null; }
}

let _cmpState = null;  // 对比图绘制上下文（纵线/浮窗用）
let _cmpPin = null;    // 对比图锁定状态：{xi, tipX, tipY}——双击锁定纵线+浮窗，浮窗可拖动
let _cmpSize = null;   // 对比图画布尺寸（首次确定后固定，避免鼠标移动重绘导致窗口抖动）

// 对比图小浮窗：填充各股票数值并定位（tipEl 可传跟随浮窗；位置 clamp 在画布内防抖动）
function showCmpTipAt(xi, tipX, tipY, tipEl) {
  const st = _cmpState;
  if (!st) return;
  const tip = tipEl || document.getElementById("cmpTip");
  let html = "<div style='font-weight:600;margin-bottom:3px'>" + (st.items[0].dates[xi] || "") + "</div>";
  st.series.forEach((s, k) => {
    const v = s.vals[xi];
    const chg = v - 100;
    html += "<div style='color:" + CMP_COLORS[k % CMP_COLORS.length] + "'>" + s.name + " " + v.toFixed(2) +
            " (<span style='color:" + (chg >= 0 ? UP : DOWN) + "'>" + (chg >= 0 ? "+" : "") + chg.toFixed(2) + "%</span>)</div>";
  });
  tip.innerHTML = html;
  tip.style.display = "block";
  // clamp 在画布内：浮窗不超出画布，避免撑出滚动条导致窗口抖动
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tipX = Math.max(2, Math.min(tipX, st.W2 - tw - 2));
  tipY = Math.max(2, Math.min(tipY, st.H2 - th - 2));
  tip.style.left = tipX + "px";
  tip.style.top = tipY + "px";
}

function drawCompare() {
  const sel = [...document.querySelectorAll("#cmpList input:checked")].map(i => i.value);
  if (!sel.length) { setStatus("请至少选择一支股票"); return; }
  const from = document.getElementById("cmpFrom").value;
  const to = document.getElementById("cmpTo").value;
  // 日期范围过滤（默认最近 30 天，不超数据本身范围）
  let items = sel.map(secid => {
    const d = cmpDataOf(secid);
    if (!d || !d.closes || !d.closes.length) return null;
    let i0 = 0, i1 = d.closes.length - 1;
    if (from) { while (i0 <= i1 && d.dates[i0] < from) i0++; }
    if (to)   { while (i1 >= i0 && d.dates[i1] > to) i1--; }
    if (i1 < i0) return null;
    return {name: d.name || secid, closes: d.closes.slice(i0, i1 + 1), dates: d.dates.slice(i0, i1 + 1)};
  }).filter(Boolean);
  if (items.length < 2) { setStatus("对比需要至少 2 支股票（所选日期范围内有数据）"); return; }
  const cv = document.getElementById("compareCanvas");
  cv.style.display = "block";
  // 尺寸首次确定后固定：mousemove 重绘不重设 canvas 尺寸，避免滚动条出现/消失
  // 导致 parent 宽度变化 → 窗口大小抖动
  if (!_cmpSize) {
    const W2 = cv.parentElement.clientWidth - 40;
    const H2 = Math.max(300, W2 * 0.55);
    const dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(W2 * dpr);
    cv.height = Math.round(H2 * dpr);
    cv.style.width = W2 + "px";
    cv.style.height = H2 + "px";
    _cmpSize = {W2: W2, H2: H2, dpr: dpr};
  }
  const {W2, H2, dpr} = _cmpSize;
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W2, H2);
  const padL = 56, padR = 16, padT = 14, padB = 30;
  const plotW = W2 - padL - padR, plotH = H2 - padT - padB;
  // 归一化：以所选范围首日收盘 = 100
  const series = items.map(it => {
    const base = it.closes[0] || 1;
    return {name: it.name, vals: it.closes.map(c => c / base * 100)};
  });
  let lo = 100, hi = 100;
  for (const s of series) for (const v of s.vals) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  const pad = (hi - lo) * 0.08 || 1;
  lo -= pad; hi += pad;
  const yOf = v => padT + (hi - v) * plotH / (hi - lo);
  const xOf = i => padL + i * plotW / Math.max(1, series[0].vals.length - 1);
  // 网格 + y 轴
  ctx.strokeStyle = "#f0f0f0"; ctx.fillStyle = "#888"; ctx.font = "12px sans-serif";
  for (let t = 0; t <= 4; t++) {
    const v = lo + (hi - lo) * t / 4;
    const y = yOf(v);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W2 - padR, y); ctx.stroke();
    ctx.textAlign = "right"; ctx.fillText(v.toFixed(1), padL - 8, y + 4);
  }
  // 基线 100
  const y100 = yOf(100);
  ctx.strokeStyle = "#bbb"; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(padL, y100); ctx.lineTo(W2 - padR, y100); ctx.stroke();
  ctx.setLineDash([]);
  // 曲线 + 末端标签
  series.forEach((s, k) => {
    const col = CMP_COLORS[k % CMP_COLORS.length];
    ctx.strokeStyle = col; ctx.lineWidth = 1.8;
    ctx.beginPath();
    s.vals.forEach((v, i) => {
      const x = xOf(i), y = yOf(v);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    const lastX = xOf(s.vals.length - 1), lastY = yOf(s.vals[s.vals.length - 1]);
    ctx.fillStyle = col; ctx.font = "12px sans-serif"; ctx.textAlign = "left";
    ctx.fillText(s.name + " " + (s.vals[s.vals.length - 1] - 100).toFixed(1) + "%",
                 Math.min(lastX + 6, W2 - padR - 130), lastY + 4);
  });
  // x 轴日期刻度：均匀显示 5 个（首/尾 + 3 个中间点），避免只显示首尾不完整
  const dts = items[0].dates;
  ctx.fillStyle = "#888"; ctx.textAlign = "center"; ctx.font = "11px sans-serif";
  const tickCount = 5;
  for (let t = 0; t < tickCount; t++) {
    const idx = Math.round(t * (dts.length - 1) / (tickCount - 1));
    ctx.fillText(dts[idx] || "", xOf(idx), H2 - 10);
  }
  // 保存状态供纵线/浮窗
  _cmpState = {cv, W2, H2, padL, padR, padT, padB, plotW, plotH, lo, hi, xOf, yOf,
               series, items, len: series[0].vals.length};
  // 双击锁定后纵线持续显示（不随鼠标消失）
  if (_cmpPin) {
    ctx.strokeStyle = "#2563eb"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(xOf(_cmpPin.xi), padT); ctx.lineTo(xOf(_cmpPin.xi), H2 - padB); ctx.stroke();
  }
}

// 对比图鼠标纵线 + 小浮窗（显示各股票对应归一化值与涨跌幅）
const cmpCanvas = document.getElementById("compareCanvas");
cmpCanvas.addEventListener("mousemove", e => {
  const st = _cmpState;
  if (!st) return;
  const rect = cmpCanvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const followTip = document.getElementById("cmpFollowTip");
  // 锁定状态：锁定纵线+锁定浮窗保持，鼠标移动显示虚线跟随 + 跟随浮窗（与主图一致）
  if (_cmpPin) {
    drawCompare();
    const c2 = cmpCanvas.getContext("2d");
    c2.strokeStyle = "#2563eb"; c2.lineWidth = 1.5;
    c2.beginPath(); c2.moveTo(st.xOf(_cmpPin.xi), st.padT); c2.lineTo(st.xOf(_cmpPin.xi), st.H2 - st.padB); c2.stroke();
    showCmpTipAt(_cmpPin.xi, _cmpPin.tipX, _cmpPin.tipY);
    // 虚线跟随：鼠标在绘图区内画虚线纵线
    if (x >= st.padL && x <= st.W2 - st.padR && y >= st.padT && y <= st.H2 - st.padB) {
      c2.strokeStyle = "rgba(0,0,0,0.25)"; c2.lineWidth = 1; c2.setLineDash([4, 4]);
      c2.beginPath(); c2.moveTo(x, st.padT); c2.lineTo(x, st.H2 - st.padB); c2.stroke();
      c2.setLineDash([]);
    }
    // 跟随浮窗：鼠标在绘图区内则显示鼠标位置数据（避让锁定浮窗）
    if (x >= st.padL && x <= st.W2 - st.padR && y >= st.padT && y <= st.H2 - st.padB) {
      const xi = Math.max(0, Math.min(st.len - 1, Math.round((x - st.padL) / st.plotW * (st.len - 1))));
      let fx = x + 14, fy = y - 10;
      followTip.innerHTML = "";
      followTip.style.display = "block";
      showCmpTipAt(xi, fx, fy, followTip);
      const tw = followTip.offsetWidth, th = followTip.offsetHeight;
      if (fx + tw > st.W2) fx = x - tw - 14;
      if (fy - th < 0) fy = y + 14;
      // 与锁定浮窗碰撞避让（多级回退 + 二次检查，彻底避免偶发重叠）：
      // 依次尝试 翻左/上方/下方，每个候选都验证与锁定浮窗不相交，都不行强制下方错开
      const lockEl = document.getElementById("cmpTip");
      if (lockEl.style.display === "block") {
        const cRect = cmpCanvas.getBoundingClientRect();
        const lr = lockEl.getBoundingClientRect();
        const lockR = {l: lr.left - cRect.left, r: lr.right - cRect.left, t: lr.top - cRect.top, b: lr.bottom - cRect.top};
        const fr = followTip.getBoundingClientRect();
        const fR = {l: fr.left - cRect.left, r: fr.right - cRect.left, t: fr.top - cRect.top, b: fr.bottom - cRect.top};
        const overlap = (a, b) => a.l < b.r && a.r > b.l && a.t < b.b && a.b > b.t;
        if (overlap(fR, lockR)) {
          const candidates = [];
          const flipX = x - tw - 14;
          if (flipX > st.padL) candidates.push({fx: flipX, fy: fy});
          const upY = lockR.t - th - 6;
          if (upY > st.padT) candidates.push({fx: fx, fy: upY});
          const downY = lockR.b + 6;
          if (downY + th < st.H2) candidates.push({fx: fx, fy: downY});
          let placed = false;
          for (const c of candidates) {
            const cR = {l: c.fx, r: c.fx + tw, t: c.fy, b: c.fy + th};
            if (!overlap(cR, lockR)) { fx = c.fx; fy = c.fy; placed = true; break; }
          }
          if (!placed) {
            // 兜底：强制放到锁定浮窗正下方（必不重叠），再 clamp 画布内
            fx = Math.max(2, Math.min(x, st.W2 - tw - 2));
            fy = Math.min(lockR.b + 6, st.H2 - th - 2);
          }
          showCmpTipAt(xi, fx, fy, followTip);
        }
      }
    } else {
      followTip.style.display = "none";
    }
    return;
  }
  if (x < st.padL || x > st.W2 - st.padR || y < st.padT || y > st.H2 - st.padB) {
    followTip.style.display = "none";
    return;
  }
  const xi = Math.max(0, Math.min(st.len - 1, Math.round((x - st.padL) / st.plotW * (st.len - 1))));
  drawCompare();  // 重绘基础图
  const c2 = cmpCanvas.getContext("2d");
  c2.strokeStyle = "#94a3b8"; c2.lineWidth = 1;
  c2.beginPath(); c2.moveTo(st.xOf(xi), st.padT); c2.lineTo(st.xOf(xi), st.H2 - st.padB); c2.stroke();
  // 小浮窗：各股票数值（跟随鼠标，避让边缘）
  let tipX = x + 14, tipY = y - 10;
  followTip.innerHTML = "";
  followTip.style.display = "block";
  showCmpTipAt(xi, tipX, tipY, followTip);
  const tipW = followTip.offsetWidth, tipH = followTip.offsetHeight;
  if (tipX + tipW > st.W2) tipX = x - tipW - 14;
  if (tipY - tipH < 0) tipY = y + 14;
  showCmpTipAt(xi, tipX, tipY, followTip);
});
cmpCanvas.addEventListener("mouseleave", () => {
  const followTip = document.getElementById("cmpFollowTip");
  // 锁定状态：保留锁定纵线+锁定浮窗，跟随浮窗隐藏；未锁定则全部隐藏
  if (_cmpPin) {
    drawCompare();
    showCmpTipAt(_cmpPin.xi, _cmpPin.tipX, _cmpPin.tipY);
    followTip.style.display = "none";
  } else {
    followTip.style.display = "none";
    document.getElementById("cmpTip").style.display = "none";
    if (_cmpState) drawCompare();
  }
});
// 双击锁定/解锁纵线+浮窗（与主图交互一致）
cmpCanvas.addEventListener("dblclick", e => {
  const st = _cmpState;
  if (!st) return;
  if (_cmpPin) {
    _cmpPin = null;
    document.getElementById("cmpTip").style.display = "none";
    document.getElementById("cmpFollowTip").style.display = "none";
    drawCompare();
    return;
  }
  const rect = cmpCanvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  if (x < st.padL || x > st.W2 - st.padR || y < st.padT || y > st.H2 - st.padB) return;
  const xi = Math.max(0, Math.min(st.len - 1, Math.round((x - st.padL) / st.plotW * (st.len - 1))));
  let tipX = x + 14, tipY = y - 10;
  const tip = document.getElementById("cmpTip");
  tip.innerHTML = "";
  tip.style.display = "block";
  showCmpTipAt(xi, tipX, tipY);
  const tipW = tip.offsetWidth, tipH = tip.offsetHeight;
  if (tipX + tipW > st.W2) tipX = x - tipW - 14;
  if (tipY - tipH < 0) tipY = y + 14;
  _cmpPin = {xi: xi, tipX: tipX, tipY: tipY};
  drawCompare();
  showCmpTipAt(_cmpPin.xi, _cmpPin.tipX, _cmpPin.tipY);
});
// 锁定后浮窗可拖动（同主图 pinTip）
document.getElementById("cmpTip").addEventListener("mousedown", e => {
  if (!_cmpPin) return;
  e.preventDefault();
  const startX = e.clientX, startY = e.clientY;
  const ox = _cmpPin.tipX, oy = _cmpPin.tipY;
  const onMove = ev => {
    _cmpPin.tipX = ox + (ev.clientX - startX);
    _cmpPin.tipY = oy + (ev.clientY - startY);
    const tip = document.getElementById("cmpTip");
    tip.style.left = _cmpPin.tipX + "px";
    tip.style.top = _cmpPin.tipY + "px";
  };
  const onUp = () => {
    window.removeEventListener("mousemove", onMove);
    window.removeEventListener("mouseup", onUp);
  };
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
});

document.getElementById("cmpBtn").addEventListener("click", () => {
  const list = cmpCandidates();
  if (!list.length) { setStatus("暂无可对比的股票（先查询或加入自选股）"); return; }
  // 默认日期范围：各股票数据并集范围，默认取最近 30 天
  let minD = null, maxD = null;
  for (const c of list) {
    const d = cmpDataOf(c.secid);
    if (d && d.dates && d.dates.length) {
      const a = d.dates[0], b = d.dates[d.dates.length - 1];
      if (!minD || a < minD) minD = a;
      if (!maxD || b > maxD) maxD = b;
    }
  }
  const fromEl = document.getElementById("cmpFrom"), toEl = document.getElementById("cmpTo");
  if (minD && maxD) {
    const toD = new Date(maxD + "T00:00:00");
    const fromD = new Date(toD); fromD.setDate(fromD.getDate() - 29);
    const fromS = fromD.toISOString().slice(0, 10);
    fromEl.value = fromS < minD ? minD : fromS;
    toEl.value = maxD;
    document.getElementById("cmpRangeTip").textContent = "可用范围 " + minD + " ~ " + maxD;
  }
  const box = document.getElementById("cmpList");
  box.innerHTML = list.map((c, i) =>
    "<label class='cmp-item'><input type='checkbox' value='" + c.secid + "' " + (i < 2 ? "checked" : "") + ">" +
    c.name + " <span style='color:#999'>" + c.secid + "</span></label>"
  ).join("");
  document.getElementById("compareOverlay").style.display = "flex";
  document.getElementById("compareCanvas").style.display = "none";
  _cmpSize = null;  // 重新打开时重算画布尺寸
  _cmpPin = null;
});
// 日期范围变更自动重绘
document.getElementById("cmpFrom").addEventListener("change", () => {
  if (document.getElementById("compareCanvas").style.display === "block" && _cmpState) drawCompare();
});
document.getElementById("cmpTo").addEventListener("change", () => {
  if (document.getElementById("compareCanvas").style.display === "block" && _cmpState) drawCompare();
});
document.getElementById("cmpGo").addEventListener("click", drawCompare);
document.getElementById("cmpClose").addEventListener("click", () => {
  _cmpPin = null;
  document.getElementById("compareOverlay").style.display = "none";
});
// 点击对比图以外的区域（overlay 背景/控件区/画布容器）清除锁定——与主图"点击图表外清除"一致
document.getElementById("compareOverlay").addEventListener("click", e => {
  if (!_cmpPin) return;
  const cv = document.getElementById("compareCanvas");
  const tip = document.getElementById("cmpTip");
  // 图表本身与锁定浮窗（拖动）不触发清除
  if (e.target === cv || e.target === tip || tip.contains(e.target)) return;
  _cmpPin = null;
  document.getElementById("cmpTip").style.display = "none";
  document.getElementById("cmpFollowTip").style.display = "none";
  if (_cmpState) drawCompare();
});
// ---- 行情卡片分享（导出 PNG 图片文件） ----
document.getElementById("shareBtn").addEventListener("click", () => {
  if (!D || !n) { setStatus("请先查询股票再分享卡片"); return; }
  const last = n - 1;
  let chartDataUrl;
  try { chartDataUrl = cv.toDataURL("image/png"); } catch (e) { setStatus("图表截图失败: " + e); return; }
  const v = x => x != null ? fmt(x) : "—";
  const rows = [
    ["最新收盘", v(D.closes[last])],
    ["涨跌幅", (D.changes[last] != null ? fmt(D.changes[last]) : "—") + "%"],
    ["MA5", v(D.ma5 && D.ma5[last])],
    ["MA20", v(D.ma20 && D.ma20[last])],
    ["RSI(14)", D.rsi && D.rsi[last] != null ? D.rsi[last].toFixed(2) : "—"],
    ["DIF / DEA", (D.macd_dif && D.macd_dif[last] != null ? D.macd_dif[last].toFixed(3) : "—") + " / " +
                  (D.macd_dea && D.macd_dea[last] != null ? D.macd_dea[last].toFixed(3) : "—")],
  ];
  // 绘制卡片 → 导出 PNG 下载
  const draw = () => {
    const W = 560, PAD = 18, SCALE = 2;  // SCALE: 物理像素放大倍数（高清导出）
    const cw = W - PAD * 2;
    const img = new Image();
    img.onload = () => {
      const imgH = Math.round(cw * img.height / img.width);
      const titleH = 42, subH = 24, rowH = 33, footH = 30;
      const H = PAD * 2 + titleH + subH + imgH + rows.length * rowH + footH;
      const c = document.createElement("canvas");
      c.width = W * SCALE; c.height = H * SCALE;   // 物理像素放大，清晰度翻倍
      const g = c.getContext("2d");
      g.scale(SCALE, SCALE);                        // 逻辑坐标不变，整体放大绘制
      // 背景
      g.fillStyle = "#f7f8fa"; g.fillRect(0, 0, W, H);
      // 白卡片（圆角）
      const rr = (x, y, w, h, r) => {
        g.beginPath();
        g.moveTo(x + r, y);
        g.arcTo(x + w, y, x + w, y + h, r);
        g.arcTo(x + w, y + h, x, y + h, r);
        g.arcTo(x, y + h, x, y, r);
        g.arcTo(x, y, x + w, y, r);
        g.closePath();
        g.fill();
      };
      g.fillStyle = "#fff"; rr(6, 6, W - 12, H - 12, 12);
      let y = PAD + 6;
      // 标题：名称 + 代码
      g.textAlign = "left"; g.textBaseline = "top";
      g.fillStyle = "#111827"; g.font = "bold 20px 'Microsoft YaHei', sans-serif";
      g.fillText(_curName || "", PAD, y);
      g.fillStyle = "#888"; g.font = "13px 'Microsoft YaHei', sans-serif";
      g.fillText(_curSecid || "", PAD + 170, y + 6);
      y += titleH;
      // 副标题：日期范围
      g.fillStyle = "#888"; g.font = "13px 'Microsoft YaHei', sans-serif";
      g.fillText(D.dates[0] + " ~ " + D.dates[last] + " · " + n + " 个交易日 · " + fmtTime(Date.now()), PAD, y);
      y += subH;
      // 图表
      g.drawImage(img, PAD, y, cw, imgH);
      y += imgH + 6;
      // 指标表格
      for (const [k, val] of rows) {
        g.strokeStyle = "#f0f0f0"; g.beginPath(); g.moveTo(PAD, y + rowH - 1); g.lineTo(PAD + cw, y + rowH - 1); g.stroke();
        g.fillStyle = "#374151"; g.font = "14px 'Microsoft YaHei', sans-serif";
        g.fillText(k, PAD, y + 6);
        g.fillStyle = "#111827"; g.font = "bold 14px 'Microsoft YaHei', sans-serif";
        g.textAlign = "right";
        g.fillText(val, PAD + cw, y + 6);
        g.textAlign = "left";
        y += rowH;
      }
      // 页脚
      g.fillStyle = "#aaa"; g.font = "11px 'Microsoft YaHei', sans-serif";
      g.textAlign = "center";
      g.fillText("由 stock-forecast 生成 · 仅供学习研究，不构成投资建议", W / 2, H - footH + 8);
      g.textAlign = "left";
      // 导出下载
      try {
        const a = document.createElement("a");
        a.href = c.toDataURL("image/png");
        a.download = "行情卡片_" + (_curName || "stock") + "_" + D.dates[last] + ".png";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setStatus("卡片已导出为 PNG 图片文件");
      } catch (e2) { setStatus("导出失败: " + e2); }
    };
    img.onerror = () => setStatus("图表图片读取失败");
    img.src = chartDataUrl;
  };
  draw();
});
